<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Search Engine</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --bg: #f0f4ff;
      --card-bg: #ffffff;
      --text: #1e2340;
      --muted: #6b7280;
      --border: #d1d5db;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --radius: 12px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
      color: #fff;
      padding: 32px 24px 80px;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 6px;
      opacity: 0.85;
      font-size: 1rem;
    }

    .plane-icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 8px;
    }

    .search-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      padding: 28px;
      max-width: 820px;
      margin: -52px auto 32px;
      position: relative;
      z-index: 10;
    }

    .trip-type {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .trip-type label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--muted);
      transition: color 0.15s;
    }

    .trip-type input[type="radio"] { accent-color: var(--primary); }
    .trip-type label:has(input:checked) { color: var(--primary); }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    @media (max-width: 700px) {
      .form-row { grid-template-columns: 1fr 1fr; }
      .search-btn { grid-column: 1 / -1; }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .field label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input, .field select {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }

    .field input:focus, .field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,115,232,0.12);
    }

    .field input::placeholder { color: #adb5bd; }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      z-index: 100;
      max-height: 220px;
      overflow-y: auto;
    }

    .autocomplete-list li {
      list-style: none;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.9rem;
      border-bottom: 1px solid #f3f4f6;
      transition: background 0.1s;
    }

    .autocomplete-list li:last-child { border-bottom: none; }
    .autocomplete-list li:hover { background: #f0f4ff; }
    .autocomplete-list li .iata { font-weight: 700; color: var(--primary); margin-right: 6px; }
    .autocomplete-list li .country { font-size: 0.78rem; color: var(--muted); }

    .search-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
      height: 42px;
    }

    .search-btn:hover { background: var(--primary-dark); }
    .search-btn:active { transform: scale(0.98); }
    .search-btn:disabled { background: #93c5fd; cursor: not-allowed; }

    .options-row {
      display: flex;
      gap: 16px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .options-row .field { min-width: 120px; }

    /* Results */
    .results-section {
      max-width: 820px;
      margin: 0 auto 48px;
      padding: 0 24px;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .results-header h2 { font-size: 1.1rem; font-weight: 600; }
    .results-count { font-size: 0.85rem; color: var(--muted); }

    .results-grid {
      display: grid;
      gap: 14px;
    }

    .flight-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 1fr auto 1fr auto;
      align-items: center;
      gap: 16px;
      border: 1.5px solid transparent;
      transition: border-color 0.15s, box-shadow 0.15s;
      animation: fadeUp 0.3s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .flight-card:hover {
      border-color: #bfdbfe;
      box-shadow: 0 4px 16px rgba(26,115,232,0.12);
    }

    .route-info { display: flex; flex-direction: column; gap: 2px; }
    .route-iata { font-size: 1.5rem; font-weight: 700; }
    .route-city { font-size: 0.8rem; color: var(--muted); }

    .route-arrow {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .route-arrow .arrow-line {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .route-arrow .line {
      width: 60px;
      height: 1.5px;
      background: #d1d5db;
    }

    .route-arrow .stops-badge {
      font-size: 0.7rem;
      background: #eff6ff;
      color: var(--primary);
      border-radius: 20px;
      padding: 2px 8px;
      font-weight: 600;
    }

    .price-block {
      text-align: right;
    }

    .price {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary);
    }

    .price-currency { font-size: 1rem; vertical-align: super; margin-right: 2px; }

    .price-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .book-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin-top: 8px;
      transition: background 0.15s;
    }

    .book-btn:hover { background: var(--primary-dark); }

    .flight-details {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .detail-tag {
      font-size: 0.75rem;
      background: #f3f4f6;
      color: var(--muted);
      border-radius: 20px;
      padding: 3px 10px;
    }

    /* States */
    .state-box {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 48px 24px;
      text-align: center;
    }

    .state-box .icon { font-size: 3rem; margin-bottom: 12px; }
    .state-box h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
    .state-box p { color: var(--muted); font-size: 0.9rem; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e5e7eb;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box { color: #dc2626; }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  <span class="plane-icon">✈️</span>
  <h1>Flight Search Engine</h1>
  <p>Find the cheapest flights powered by Travelpayouts</p>
</header>

<div class="search-card">
  <div class="trip-type">
    <label><input type="radio" name="tripType" value="roundtrip" checked /> Round Trip</label>
    <label><input type="radio" name="tripType" value="oneway" /> One Way</label>
  </div>

  <div class="form-row">
    <div class="field" id="originField">
      <label>From</label>
      <input type="text" id="originInput" placeholder="City or airport" autocomplete="off" />
      <input type="hidden" id="originCode" />
      <ul class="autocomplete-list" id="originList" style="display:none"></ul>
    </div>

    <div class="field" id="destField">
      <label>To</label>
      <input type="text" id="destInput" placeholder="City or airport" autocomplete="off" />
      <input type="hidden" id="destCode" />
      <ul class="autocomplete-list" id="destList" style="display:none"></ul>
    </div>

    <div class="field">
      <label>Depart</label>
      <input type="month" id="departDate" />
    </div>

    <div class="field" id="returnDateField">
      <label>Return</label>
      <input type="month" id="returnDate" />
    </div>

    <button class="search-btn" id="searchBtn" onclick="searchFlights()">Search</button>
  </div>

  <div class="options-row">
    <div class="field">
      <label>Currency</label>
      <select id="currency">
        <option value="usd">USD $</option>
        <option value="eur">EUR €</option>
        <option value="gbp">GBP £</option>
        <option value="rub">RUB ₽</option>
      </select>
    </div>
    <div class="field">
      <label>Direct only</label>
      <select id="directOnly">
        <option value="false">All flights</option>
        <option value="true">Direct only</option>
      </select>
    </div>
    <div class="field">
      <label>Results</label>
      <select id="resultLimit">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="30">30</option>
      </select>
    </div>
  </div>
</div>

<div class="results-section" id="resultsSection">
  <div class="state-box">
    <div class="icon">🔍</div>
    <h3>Search for flights</h3>
    <p>Enter your origin and destination to find the cheapest available flights.</p>
  </div>
</div>

<footer>
  Powered by <a href="https://www.travelpayouts.com" target="_blank" style="color:var(--primary)">Travelpayouts Data API</a>
</footer>

<script>
  const API_TOKEN = '6bda9792ff206b4f68f197b4dfc399b5';
  const API_BASE  = 'https://api.travelpayouts.com';

  const currencySymbols = { usd: '$', eur: '€', gbp: '£', rub: '₽' };

  // ── Trip type toggle ──────────────────────────────────────────────
  document.querySelectorAll('input[name="tripType"]').forEach(r => {
    r.addEventListener('change', () => {
      const isRT = r.value === 'roundtrip';
      document.getElementById('returnDateField').style.display = isRT ? '' : 'none';
    });
  });

  // ── Set default dates ─────────────────────────────────────────────
  (function setDefaultDates() {
    const now = new Date();
    const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const monthAfter = new Date(now.getFullYear(), now.getMonth() + 2, 1);
    const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    document.getElementById('departDate').value = fmt(nextMonth);
    document.getElementById('returnDate').value  = fmt(monthAfter);
  })();

  // ── Autocomplete ──────────────────────────────────────────────────
  let acTimers = {};

  function setupAutocomplete(inputId, listId, hiddenId) {
    const input  = document.getElementById(inputId);
    const list   = document.getElementById(listId);
    const hidden = document.getElementById(hiddenId);

    input.addEventListener('input', () => {
      clearTimeout(acTimers[inputId]);
      const term = input.value.trim();
      if (term.length < 2) { list.style.display = 'none'; return; }

      acTimers[inputId] = setTimeout(() => fetchPlaces(term, list, input, hidden), 280);
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('#' + inputId.replace('Input','Field'))) {
        list.style.display = 'none';
      }
    });
  }

  async function fetchPlaces(term, list, input, hidden) {
    try {
      const url = `https://autocomplete.travelpayouts.com/places2?term=${encodeURIComponent(term)}&locale=en&types[]=city&types[]=airport`;
      const res = await fetch(url);
      const data = await res.json();

      list.innerHTML = '';
      if (!data.length) { list.style.display = 'none'; return; }

      data.slice(0, 8).forEach(place => {
        const code = place.code || (place.main_airport_iata);
        if (!code) return;
        const li = document.createElement('li');
        li.innerHTML = `<span class="iata">${code}</span>${place.name}<span class="country"> · ${place.country_name || ''}</span>`;
        li.addEventListener('click', () => {
          input.value  = `${place.name} (${code})`;
          hidden.value = code;
          list.style.display = 'none';
        });
        list.appendChild(li);
      });
      list.style.display = data.length ? 'block' : 'none';
    } catch {
      list.style.display = 'none';
    }
  }

  setupAutocomplete('originInput', 'originList', 'originCode');
  setupAutocomplete('destInput',   'destList',   'destCode');

  // ── Search ────────────────────────────────────────────────────────
  async function searchFlights() {
    const origin   = document.getElementById('originCode').value || document.getElementById('originInput').value.trim().toUpperCase();
    const dest     = document.getElementById('destCode').value   || document.getElementById('destInput').value.trim().toUpperCase();
    const depart   = document.getElementById('departDate').value;
    const ret      = document.getElementById('returnDate').value;
    const currency = document.getElementById('currency').value;
    const direct   = document.getElementById('directOnly').value;
    const limit    = document.getElementById('resultLimit').value;
    const tripType = document.querySelector('input[name="tripType"]:checked').value;

    if (!origin || !dest) {
      showError('Please enter both origin and destination.');
      return;
    }

    const btn = document.getElementById('searchBtn');
    btn.disabled = true;
    btn.textContent = 'Searching…';
    showLoading();

    const params = new URLSearchParams({
      origin,
      destination: dest,
      depart_date: depart || '',
      currency,
      token: API_TOKEN,
      limit,
      direct,
    });

    if (tripType === 'roundtrip' && ret) params.set('return_date', ret);
    if (tripType === 'oneway') params.set('one_way', 'true');

    const url = `${API_BASE}/v1/prices/cheap?${params}`;

    try {
      const res  = await fetch(url, { headers: { 'X-Access-Token': API_TOKEN } });
      const json = await res.json();

      if (!json.success) {
        showError(json.error || 'API returned an error. Try different search parameters.');
        return;
      }

      const rawData = json.data || {};
      const flights = [];

      Object.entries(rawData).forEach(([destKey, flightsByDate]) => {
        Object.entries(flightsByDate).forEach(([dateKey, ticket]) => {
          flights.push({
            origin:      ticket.origin      || origin,
            destination: ticket.destination || destKey,
            depart_date: ticket.depart_date || dateKey,
            return_date: ticket.return_date,
            price:       ticket.price,
            transfers:   ticket.transfers,
            airline:     ticket.airline,
            flight_number: ticket.flight_number,
            expires_at:  ticket.expires_at,
          });
        });
      });

      flights.sort((a, b) => a.price - b.price);
      renderResults(flights, origin, dest, currency);
    } catch (err) {
      console.error(err);
      showError('Network error. Please check your connection and try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Search';
    }
  }

  // ── Render ────────────────────────────────────────────────────────
  function renderResults(flights, origin, dest, currency) {
    const section = document.getElementById('resultsSection');
    const sym = currencySymbols[currency] || currency.toUpperCase();

    if (!flights.length) {
      section.innerHTML = `
        <div class="state-box">
          <div class="icon">😕</div>
          <h3>No flights found</h3>
          <p>Try different dates, cities, or remove the "Direct only" filter.</p>
        </div>`;
      return;
    }

    const cards = flights.map((f, i) => {
      const stopsLabel = f.transfers === 0 ? 'Direct' : f.transfers === 1 ? '1 stop' : `${f.transfers} stops`;
      const departStr  = f.depart_date  ? new Date(f.depart_date + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '—';
      const returnStr  = f.return_date  ? new Date(f.return_date + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : null;
      const bookUrl    = `https://www.aviasales.com/search/${f.origin}${f.depart_date ? f.depart_date.replace(/-/g,'').slice(0,8) : ''}${f.destination}1`;

      return `
        <div class="flight-card" style="animation-delay:${i * 0.04}s">
          <div class="route-info">
            <div class="route-iata">${f.origin}</div>
            <div class="route-city">Departure</div>
            <div class="flight-details" style="margin-top:8px">
              <span class="detail-tag">✈ ${departStr}</span>
              ${f.airline ? `<span class="detail-tag">${f.airline}${f.flight_number ? ' ' + f.flight_number : ''}</span>` : ''}
            </div>
          </div>

          <div class="route-arrow">
            <div class="arrow-line">
              <div class="line"></div>
              <span>▶</span>
            </div>
            <span class="stops-badge">${stopsLabel}</span>
            ${returnStr ? `<div style="margin-top:4px;font-size:0.7rem;color:var(--muted)">↩ ${returnStr}</div>` : ''}
          </div>

          <div class="route-info">
            <div class="route-iata">${f.destination}</div>
            <div class="route-city">Arrival</div>
          </div>

          <div class="price-block">
            <div class="price"><span class="price-currency">${sym}</span>${f.price.toLocaleString()}</div>
            <div class="price-label">per person</div>
            <a class="book-btn" href="${bookUrl}" target="_blank" rel="noopener">Book now</a>
          </div>
        </div>`;
    }).join('');

    section.innerHTML = `
      <div class="results-header">
        <h2>Available Flights</h2>
        <span class="results-count">${flights.length} result${flights.length !== 1 ? 's' : ''} found</span>
      </div>
      <div class="results-grid">${cards}</div>`;
  }

  function showLoading() {
    document.getElementById('resultsSection').innerHTML = `
      <div class="state-box">
        <div class="spinner"></div>
        <h3>Searching for flights…</h3>
        <p>Finding the best prices for you.</p>
      </div>`;
  }

  function showError(msg) {
    document.getElementById('resultsSection').innerHTML = `
      <div class="state-box error-box">
        <div class="icon">⚠️</div>
        <h3>Something went wrong</h3>
        <p>${msg}</p>
      </div>`;
    document.getElementById('searchBtn').disabled = false;
    document.getElementById('searchBtn').textContent = 'Search';
  }

  // Allow pressing Enter to search
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.activeElement.tagName === 'INPUT') searchFlights();
  });
</script>

</body>
</html>
